services:
  db:
    image: postgres:16
    container_name: backup-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-backup_platform}
      POSTGRES_USER: ${POSTGRES_USER:-backup_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-backup_user} -d ${POSTGRES_DB:-backup_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: backup-platform-api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://backup_user:change_me@db:5432/backup_platform}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
